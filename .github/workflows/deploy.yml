name: CloudWatch Monitoring Project

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "Project files:"
          ls -la
          echo "Backend:"
          ls -la backend
          echo "Frontend:"
          ls -la frontend

      - name: Test GitHub Actions
        run: echo "GitHub Actions is working successfully!"

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/login-app
            git pull origin main
            sudo cp /home/ubuntu/login-app/frontend/dashboard.html /var/www/login-app/dashboard.html
            sudo systemctl restart login-backend.service
            sudo systemctl status login-backend.service --no-pager
            echo "Checking application health..."
            sleep 5
            curl -f http://localhost/api/health