<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudWatch Login App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h1>Welcome Back</h1>
            <p>Login to your application</p>

            <form id="loginForm">
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <div id="message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
